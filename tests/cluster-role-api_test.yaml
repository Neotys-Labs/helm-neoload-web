suite: test cluster role in API mode
templates:
  - cluster-role.yaml
tests:
  - it: should grant list and get on endpoints when HA mode is API
    release:
      namespace: default
    set:
      services.webapp.host: myapp.example.com
      services.api.host: myapi.example.com
      services.files.host: myfiles.example.com
      domain: .example.com
      ingress.enabled: false
      neoload.configuration.backend.mongo.host: mymongo.example.com
      neoload.configuration.ha.mode: API
      clusterRbac.enabled: true
    asserts:
      - isKind:
          of: ClusterRole
      - equal:
          path: metadata.name
          value: RELEASE-NAME-hazelcast-cluster-role
      - equal:
          path: rules[0].resources
          value:
            - endpoints
            - pods
            - nodes
            - services
      - equal:
          path: rules[0].verbs
          value:
            - get
            - list
