suite: test mongo secret credentials
templates:
  - secrets-mongo.yaml
tests:
  - it: should store the MongoDB host username and password
    release:
      namespace: default
    set:
      services.webapp.host: myapp.example.com
      services.api.host: myapi.example.com
      services.files.host: myfiles.example.com
      domain: .example.com
      ingress.enabled: false
      neoload.configuration.backend.mongo.host: mymongo.example.com
      mongodb.mongodbUsername: nlw-user
      mongodb.mongodbPassword: nlw-password
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-nlweb-mongo-secret
      - equal:
          path: type
          value: Opaque
      - equal:
          path: data.host
          value: bXltb25nby5leGFtcGxlLmNvbQ==
      - equal:
          path: data.username
          value: bmx3LXVzZXI=
      - equal:
          path: data.password
          value: bmx3LXBhc3N3b3Jk
