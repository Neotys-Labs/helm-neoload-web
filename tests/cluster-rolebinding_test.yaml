suite: test hazelcast cluster role binding
templates:
  - cluster-rolebinding.yaml
tests:
  - it: should bind the chart service account in API mode
    release:
      namespace: default
    set:
      services.webapp.host: myapp.example.com
      services.api.host: myapi.example.com
      services.files.host: myfiles.example.com
      domain: .example.com
      ingress.enabled: false
      neoload.configuration.backend.mongo.host: mymongo.example.com
    asserts:
      - isKind:
          of: ClusterRoleBinding
      - equal:
          path: metadata.name
          value: RELEASE-NAME-hazelcast-cluster-role-binding
      - equal:
          path: subjects[0].kind
          value: ServiceAccount
      - equal:
          path: subjects[0].name
          value: RELEASE-NAME-nlweb
      - equal:
          path: subjects[0].namespace
          value: default
      - equal:
          path: roleRef.name
          value: RELEASE-NAME-hazelcast-cluster-role
