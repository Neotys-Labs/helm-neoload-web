suite: test mongo secret skipped for an existing secret
templates:
  - secrets-mongo.yaml
tests:
  - it: should not render a MongoDB secret when existingSecret is set
    release:
      namespace: default
    set:
      services.webapp.host: myapp.example.com
      services.api.host: myapi.example.com
      services.files.host: myfiles.example.com
      domain: .example.com
      ingress.enabled: false
      neoload.configuration.backend.mongo.host: mymongo.example.com
      mongodb.existingSecret: mongo-existing
    asserts:
      - hasDocuments:
          count: 0
