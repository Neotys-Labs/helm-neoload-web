suite: test ingress mcp server
templates:
  - ingress-mcp-server.yaml
tests:
  - it: should render dedicated MCP ingress on the API host
    release:
      namespace: default
    set:
      services.webapp.host: myapp.example.com
      services.api.host: myapi.example.com
      services.api-v4.host: myapi.example.com
      services.files.host: myfiles.example.com
      domain: .example.com
      ingress.enabled: true
      neoload.configuration.backend.mongo.host: mymongo.example.com
    asserts:
      - isKind:
          of: Ingress
      - equal:
          path: metadata.name
          value: RELEASE-NAME-nlweb-ingress-mcp-server
      - equal:
          path: spec.rules[0].host
          value: myapi.example.com
      - equal:
          path: spec.rules[0].http.paths[0].path
          value: /mcp-server
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.name
          value: RELEASE-NAME-nlweb-svc-mcp-server
  - it: should not render MCP ingress when replicaCount is zero
    release:
      namespace: default
    set:
      services.webapp.host: myapp.example.com
      services.api.host: myapi.example.com
      services.files.host: myfiles.example.com
      domain: .example.com
      ingress.enabled: true
      neoload.configuration.backend.mongo.host: mymongo.example.com
      replicaCount.mcpServer: 0
    asserts:
      - hasDocuments:
          count: 0
