suite: test notes
templates:
  - NOTES.txt
tests:
  - it: should list MCP URL when MCP is enabled
    release:
      namespace: default
    set:
      services.webapp.host: myapp.example.com
      services.api.host: myapi.example.com
      services.api-v4.host: myapi.example.com
      services.files.host: myfiles.example.com
      domain: .example.com
      ingress.enabled: true
      neoload.configuration.backend.mongo.host: mymongo.example.com
    asserts:
      - matchRegexRaw:
          pattern: myapi\.example\.com/mcp-server
  - it: should not list MCP URL when replicaCount is zero
    release:
      namespace: default
    set:
      services.webapp.host: myapp.example.com
      services.api.host: myapi.example.com
      services.api-v4.host: myapi.example.com
      services.files.host: myfiles.example.com
      domain: .example.com
      ingress.enabled: true
      neoload.configuration.backend.mongo.host: mymongo.example.com
      replicaCount.mcpServer: 0
    asserts:
      - notMatchRegexRaw:
          pattern: mcp-server
  - it: should not list MCP URL when service ingress is null
    release:
      namespace: default
    set:
      services.webapp.host: myapp.example.com
      services.api.host: myapi.example.com
      services.api-v4.host: myapi.example.com
      services.files.host: myfiles.example.com
      domain: .example.com
      ingress.enabled: true
      neoload.configuration.backend.mongo.host: mymongo.example.com
      services.mcp-server.ingress: null
    asserts:
      - notMatchRegexRaw:
          pattern: mcp-server
