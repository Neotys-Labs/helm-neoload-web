suite: test hazelcast service in DNS mode
templates:
  - service-hazelcast.yaml
tests:
  - it: should be a headless service when HA mode is DNS
    release:
      namespace: default
    set:
      services.webapp.host: myapp.example.com
      services.api.host: myapi.example.com
      services.files.host: myfiles.example.com
      domain: .example.com
      ingress.enabled: false
      neoload.configuration.backend.mongo.host: mymongo.example.com
      neoload.configuration.ha.mode: DNS
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-nlweb-svc-hazelcast-dns
      - equal:
          path: spec.clusterIP
          value: None
      - equal:
          path: spec.publishNotReadyAddresses
          value: true
      - equal:
          path: spec.ports[0].port
          value: 6901
