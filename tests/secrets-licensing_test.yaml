suite: test licensing secret
templates:
  - secrets-licensing.yaml
tests:
  - it: should store the licensing platform token
    release:
      namespace: default
    set:
      services.webapp.host: myapp.example.com
      services.api.host: myapi.example.com
      services.files.host: myfiles.example.com
      domain: .example.com
      ingress.enabled: false
      neoload.configuration.backend.mongo.host: mymongo.example.com
      neoload.configuration.backend.licensingPlatformToken: platform-token
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-nlweb-licensing-secret
      - equal:
          path: data.licensingPlatformToken
          value: cGxhdGZvcm0tdG9rZW4=
